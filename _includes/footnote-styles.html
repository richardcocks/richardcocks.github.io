<style>
  /* Kramdown appends footnotes to the end of the content. Lift them out into
     their own box so they don't read as a continuation of the article. */
  .footnotes {
    margin-top: 3em;
    padding: 0.5em 1.5em 1em;
    border: 1px solid #e8e8e8;
    border-radius: 4px;
    background-color: #fafafa;
    font-size: 0.9em;
  }
  .footnotes::before {
    content: "Footnotes";
    display: block;
    margin: 0.75em 0 0.25em;
    font-weight: bold;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-size: 0.85em;
    color: #666;
  }
  .footnotes hr {
    display: none;
  }
  .footnotes ol {
    margin-bottom: 0;
  }
  .footnotes li:last-child p:last-child {
    margin-bottom: 0;
  }
</style>
